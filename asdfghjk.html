<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Exhibition Competitions Portal</title>
    <link rel="icon" type="image/png" href="logo1.png">
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 1. LOADING SCREEN STYLING */
        #loader-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #020c1b;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Chakra Petch', sans-serif;
            animation: hideLoader 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 0.8s; 
        }

        @keyframes hideLoader {
            0% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; display: none; }
        }

        .loader-logo {
            width: 100px;
            height: 100px;
            background-color: #000;
            border-radius: 50%;
            margin-bottom: 25px;
            border: 2px solid #38b6ff;
            box-shadow: 0 0 15px rgba(56, 182, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .loader-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .loader-text {
            color: #ffffff;
            font-size: 19px;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 0 8px rgba(56, 182, 255, 0.6);
            animation: textBlink 0.3s infinite alternate;
        }
        
        @keyframes textBlink {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .progress-container {
            width: 200px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(56, 182, 255, 0.2);
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #38b6ff;
            box-shadow: 0 0 10px #38b6ff;
            animation: fillBar 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fillBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* 2. MAIN PAGE STYLING */
        body {
            background: linear-gradient(135deg, #020c1b 0%, #0a192f 35%, #0f2b48 70%, #031424 100%);
            background-size: 400% 400%;
            animation: liquidBg 12s ease infinite; 
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        @keyframes liquidBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bubbles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }
        .bubble {
            position: absolute;
            bottom: -60px;
            background-color: rgba(255, 255, 255, 0.06); 
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.03);
            animation: floatUp infinite linear;
        }
        .bubble:nth-child(1) { left: 8%; width: 45px; height: 45px; animation-duration: 9s; animation-delay: 0s; }
        .bubble:nth-child(2) { left: 22%; width: 25px; height: 25px; animation-duration: 7s; animation-delay: 2s; }
        .bubble:nth-child(3) { left: 38%; width: 55px; height: 55px; animation-duration: 11s; animation-delay: 1s; }
        .bubble:nth-child(4) { left: 52%; width: 35px; height: 35px; animation-duration: 8s; animation-delay: 4s; }
        .bubble:nth-child(5) { left: 68%; width: 28px; height: 28px; animation-duration: 10s; animation-delay: 0s; }
        .bubble:nth-child(6) { left: 82%; width: 48px; height: 48px; animation-duration: 12s; animation-delay: 3s; }
        .bubble:nth-child(7) { left: 92%; width: 18px; height: 18px; animation-duration: 6s; animation-delay: 1s; }
        .bubble:nth-child(8) { left: 14%; width: 38px; height: 38px; animation-duration: 10s; animation-delay: 5s; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-115vh) scale(1.2); opacity: 0; }
        }

        .wrapper {
            text-align: center;
            width: 82%; 
            max-width: 720px; 
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        
        .glass-panel {
            background: rgba(4, 18, 31, 0.72); 
            backdrop-filter: blur(20px);         
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12); 
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .logo-container {
            width: 120px;
            height: 120px;
            background-color: #000000;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 23px !important; 
            font-family: 'Chakra Petch', sans-serif; 
            color: #ffffff; 
            margin-bottom: 12px !important; 
            font-weight: bold;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            text-transform: none;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 15px; 
        }

        .link-item {
            display: block;
            text-decoration: none;
            color: #000000; 
            padding: 16px 20px;
            border-radius: 6px;
            font-size: 16.5px;
            font-weight: bold;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1); 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-1, .btn-2, .btn-3, .btn-4 { 
            background-color: #38b6ff; 
        }

        .link-item:hover { 
            background-color: rgba(255, 255, 255, 0.12) !important; 
            backdrop-filter: blur(8px) !important;                  
            -webkit-backdrop-filter: blur(8px) !important;
            border: 2px solid rgba(255, 255, 255, 0.5) !important;   
            color: #ffffff !important;                                
            font-size: 19px !important; 
            box-shadow: 0 0 20px rgba(56, 182, 255, 0.2) !important; 
        }
        
        @media (max-width: 768px) {
            .wrapper { width: 92%; }
            .glass-panel { padding: 30px 18px; }
            .link-item { font-size: 14px; padding: 13px 12px; }
            .link-item:hover { font-size: 15.5px !important; }
            .logo-container { width: 100px; height: 100px; }
            h1 { font-size: 16px; } 
        }
    </style>
</head>
<body>

<div id="loader-screen">
    <div class="loader-logo">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'; this.parentNode.innerHTML='<span style=\'color:#38b6ff;font-weight:bold;font-size:14px;\'>LOGO</span>'">
    </div>
    <div class="loader-text">LOADING...</div>
    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>
</div>

<div class="bubbles-container">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
</div>

<div class="wrapper">
    <div class="glass-panel">
        <div class="logo-container">
            <img src="logo.png" alt="Exhibition Logo" onerror="this.style.display='none'; this.parentNode.innerHTML='<span style=\'color:#38b6ff;font-weight:bold;font-size:16px;\'>LOGO</span>'">
        </div>

        <h1>Select Your Competition Below to Register</h1>
        <br>
        <div class="link-list">
            <a href="https://docs.google.com/forms/d/e/1FAIpQLScKVG4K6NPnOyxDqGsrSrp89GuP1PzmfWDmBxb_Ni1DiYgf2w/viewform" target="_blank" class="link-item btn-1">MindRush - Quiz Compitition</a>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSeqPLwtsNA4LDOQ2ucvH77rvbnckFKB705HJLB2qdh7D9ptUA/viewform" target="_blank" class="link-item btn-2">FutureBit - Smart Solutions with Micro:bit</a>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLScGXZ_vstPgKiFwUTrayfeGTF_7QvaR5otD9oq9BRoQiPBFLQ/viewform?usp=send_form" target="_blank" class="link-item btn-3">The Great Debate</a>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSdSZ1h3_IAtkQqSNBrMjIFvyfssBWUOUutBPAr2cl3Aax5Oqg/viewform" target="_blank" class="link-item btn-4">Path Finders - RoboTrack Championship</a>
        </div>
    </div>
</div>

</body>
</html>
