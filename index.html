<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICT Day Competition Timer</title>
  <link rel="icon" type="image/x-icon" href="logo1.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Dark Blue Animated Background */
    body {
      background: linear-gradient(-45deg, #010610, #020c10, #00365a, #010610, #020c1b);
      background-size: 400% 400%;
      animation: darkBlueGradientBG 30s ease infinite;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      position: relative;
      overflow-x: hidden;
    }

    @keyframes darkBlueGradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Animated Glowing Tech Data Rays Container */
    .neon-lines-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    /* Slower Moving Neon Lines */
    .line {
      position: absolute;
      background: linear-gradient(90deg, transparent, #0284c7, #38bdf8, transparent);
      box-shadow: 0 0 12px #0284c7, 0 0 24px #38bdf8;
      border-radius: 50px;
      opacity: 0.5;
      animation: moveLine linear infinite;
    }

    .line1 {
      top: 25%;
      left: -50%;
      width: 40%;
      height: 2px;
      animation-duration: 16s;
    }

    .line2 {
      top: 50%;
      left: -60%;
      width: 60%;
      height: 2px;
      animation-duration: 22s;
      animation-delay: 3s;
    }

    .line3 {
      top: 75%;
      left: -40%;
      width: 45%;
      height: 2px;
      animation-duration: 18s;
      animation-delay: 6s;
    }

    @keyframes moveLine {
      0% { transform: translateX(0); }
      100% { transform: translateX(300%); }
    }

    /* Responsive Glass Container */
    .container {
      position: relative;
      z-index: 1;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      width: 100%;
      max-width: 650px;
      padding: clamp(20px, 4vw, 35px);
      border-radius: clamp(16px, 3vw, 24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      text-align: center;
      margin: auto;
    }

    /* Circular Logo Holder */
    .logo-container {
      margin: 0 auto 15px auto;
      width: clamp(80px, 15vw, 110px);
      height: clamp(80px, 15vw, 110px);
      border-radius: 50%;
      padding: 4px;
      background: rgba(2, 6, 23, 0.8);
      border: 2px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    h1 {
      font-size: clamp(1.3rem, 4vw, 2rem);
      margin-bottom: clamp(10px, 2vw, 20px);
      color: #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    /* Dynamic Timer Display (Scale by Viewport) */
    .timer-display {
      font-size: clamp(3.2rem, 14vw, 6.5rem);
      font-weight: 800;
      font-family: 'Courier New', Courier, monospace;
      color: #38bdf8;
      background: rgba(2, 6, 23, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: clamp(10px, 2.5vw, 20px) 0;
      border-radius: 20px;
      margin: 15px 0;
      letter-spacing: clamp(2px, 1vw, 5px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
      transition: all 0.3s ease;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }

    /* Time Low Alert Style */
    .timer-display.danger {
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.3);
      text-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* Timing Buttons Grid Layout */
    .time-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(75px, 1fr));
      gap: clamp(6px, 1.5vw, 10px);
      justify-content: center;
      margin-bottom: clamp(15px, 3vw, 25px);
    }

    .btn-time {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: clamp(8px, 1.8vw, 12px) clamp(10px, 2vw, 20px);
      border-radius: 12px;
      font-size: clamp(0.85rem, 2.2vw, 1.1rem);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
    }

    .btn-time:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      color: #fff;
      transform: translateY(-2px);
    }

    /* Controls Layout */
    .controls {
      display: flex;
      gap: clamp(8px, 2vw, 15px);
      justify-content: center;
    }

    .btn-control {
      flex: 1;
      padding: clamp(10px, 2vw, 15px);
      font-size: clamp(0.95rem, 2.5vw, 1.2rem);
      font-weight: bold;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .btn-control:active {
      transform: scale(0.96);
    }

    .btn-start { 
      background: rgba(34, 197, 94, 0.15); 
      color: #4ade80; 
      border-color: rgba(34, 197, 94, 0.3);
    }
    .btn-pause { 
      background: rgba(234, 179, 8, 0.15); 
      color: #facc15; 
      border-color: rgba(234, 179, 8, 0.3);
    }
    .btn-reset { 
      background: rgba(239, 68, 68, 0.15); 
      color: #f87171; 
      border-color: rgba(239, 68, 68, 0.3);
    }

    .btn-start:hover { 
      background: rgba(34, 197, 94, 0.3); 
      color: #fff;
    }
    .btn-pause:hover { 
      background: rgba(234, 179, 8, 0.3); 
      color: #fff;
    }
    .btn-reset:hover { 
      background: rgba(239, 68, 68, 0.3); 
      color: #fff;
    }

    /* Extra Small Screen Adjustments (Portrait Mobile) */
    @media (max-width: 380px) {
      .time-options {
        grid-template-columns: repeat(3, 1fr);
      }
      .controls {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>

  <!-- Animated Glowing Data Rays -->
  <div class="neon-lines-bg">
    <div class="line line1"></div>
    <div class="line line2"></div>
    <div class="line line3"></div>
  </div>

  <div class="container">
    
    <!-- Circular Logo Section -->
    <div class="logo-container">
      <img src="logo.png" alt="ICT Logo" id="ict-logo">
    </div>

    <h1>Digital Timer</h1>
    
    <!-- Big Timer Display -->
    <div class="timer-display" id="timer-display">00:00</div>

    <!-- Timing Buttons -->
    <div class="time-options">
      <button class="btn-time" onclick="setTimer(30)">30s</button>
      <button class="btn-time" onclick="setTimer(240)">4 Min</button>
      <button class="btn-time" onclick="setTimer(300)">5 Min</button>
      <button class="btn-time" onclick="setTimer(600)">10 Min</button>
      <button class="btn-time" onclick="setTimer(900)">15 Min</button>
    </div>

    <!-- Timer Control Buttons -->
    <div class="controls">
      <button class="btn-control btn-start" onclick="startTimer()">START</button>
      <button class="btn-control btn-pause" onclick="pauseTimer()">PAUSE</button>
      <button class="btn-control btn-reset" onclick="resetTimer()">RESET</button>
    </div>
  </div>

  <script>
    let timeLeft = 0;
    let totalTime = 0;
    let timerInterval = null;
    let audioCtx = null;

    const display = document.getElementById('timer-display');

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playStartBeep() {
      initAudio();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.value = 900;

      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.8, audioCtx.currentTime + 0.03);
      gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.2);
    }

    function playTickSound() {
      initAudio();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.value = 600;

      gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.15);
    }

    function playDoubleBeepSound() {
      initAudio();

      function triggerSingleBeep(startTime) {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.value = 850;

        gainNode.gain.setValueAtTime(0, audioCtx.currentTime + startTime);
        gainNode.gain.linearRampToValueAtTime(0.9, audioCtx.currentTime + startTime + 0.05);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + startTime + 0.5);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start(audioCtx.currentTime + startTime);
        oscillator.stop(audioCtx.currentTime + startTime + 0.5);
      }

      triggerSingleBeep(0);
      triggerSingleBeep(0.7);
    }

    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;

      const formattedMin = String(minutes).padStart(2, '0');
      const formattedSec = String(seconds).padStart(2, '0');

      display.innerText = `${formattedMin}:${formattedSec}`;

      if (timeLeft <= 10 && timeLeft > 0) {
        display.classList.add('danger');
      } else {
        display.classList.remove('danger');
      }
    }

    function setTimer(seconds) {
      pauseTimer();
      timeLeft = seconds;
      totalTime = seconds;
      updateDisplay();
    }

    function startTimer() {
      if (timerInterval !== null || timeLeft <= 0) return;
      
      playStartBeep();

      timerInterval = setInterval(() => {
        timeLeft--;
        updateDisplay();

        if (timeLeft <= 10 && timeLeft > 0) {
          playTickSound();
        }

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          playDoubleBeepSound();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    // Reset Timer
    function resetTimer() {
      pauseTimer();
      timeLeft = totalTime;
      updateDisplay();
    }
  </script>
</body>
</html>
